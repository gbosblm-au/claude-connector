# railway.toml
# Railway deployment configuration for claude-connector v10.0.0.
# Includes the persistent volume required by the integrated Memory MCP.
# https://railway.app

[build]
builder = "nixpacks"

[deploy]
startCommand = "node src/server-http.js"
# v12.28.0 (TNX-H-004): pointed at readiness, not the old decorative /health.
# The previous target returned the literal string "ok" without verifying
# anything, so an instance whose /data volume had failed to mount kept
# receiving traffic and the restart policy could never fire.
healthcheckPath = "/health/ready"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[volumes]]
source = "claude-connector-data"
dest   = "/data"

[[services]]
name = "claude-connector"
